    <style>

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: var(--card); padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; border: 1px solid #334155; }
        h2 { margin-bottom: 10px; font-size: 24px; font-weight: 800; background: linear-gradient(90deg, #3b82f6, #2dd4bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .key-display { display: none; margin-top: 20px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #key-value { font-size: 36px; font-weight: 800; color: #4ade80; background: rgba(22, 163, 74, 0.1); border: 2px solid var(--success); padding: 20px; border-radius: 16px; margin-bottom: 20px; letter-spacing: 4px; }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 16px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; transform: translateY(-2px); }
        .footer-note { font-size: 12px; color: #64748b; margin-top: 25px; line-height: 1.6; }
        .error-msg { color: #f87171; font-weight: 700; display: none; padding: 20px; border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 12px; background: rgba(248, 113, 113, 0.05); }
