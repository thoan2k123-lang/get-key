<!DOCTYPE html>
<html>
<head>
    <title>Xác Thực Key - Trạm Tương Tác Số</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 50px; background: #f0f2f5; }
        .box { background: white; padding: 40px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 20px rgba(0,0,0,0.1); max-width: 90%; }
        #key-box { display: none; }
        #key { font-size: 30px; font-weight: bold; color: #2ecc71; margin: 20px 0; border: 2px dashed #2ecc71; padding: 15px; background: #fafffa; }
        .loading { font-size: 18px; color: #666; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>HỆ THỐNG KEY TỰ ĐỘNG</h2>
        
        <div id="loading" class="loading">Đang xác thực quyền truy cập...</div>

        <div id="key-box">
            <p style="color: #28a745; font-weight: bold;">Xác minh thành công!</p>
            <div id="key">--------</div>
            <button class="btn" onclick="copyKey()">SAO CHÉP MÃ</button>
            <p style="font-size: 12px; color: #888; margin-top: 15px;">Mã này sẽ hết hạn vào lúc 23:59 đêm nay.</p>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH ---
        const SECRET_SALT = "ThoanDepTrai@2026"; // Chuỗi bí mật
        const LINK4M_URL = "https://link4m.net/pLC9O0"; // LINK RÚT GỌN CỦA BẠN
        
        // Tên trang web của bạn trên Link4M (để nhận diện referrer)
        const SHORTENER_DOMAIN = "link4m.com"; 

        window.onload = function() {
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, ""); // Ví dụ: 20260510
            const referrer = document.referrer;
            
            // 1. Kiểm tra nếu khách đến từ Link4M
            if (referrer.includes(SHORTENER_DOMAIN)) {
                // Cấp "Vé thông hành" cho ngày hôm nay
                localStorage.setItem('access_proof', today);
                showKey(today);
            } 
            // 2. Nếu khách vào trực tiếp (Bookmark)
            else {
                const savedProof = localStorage.getItem('access_proof');
                
                if (savedProof === today) {
                    // Nếu "Vé" vẫn còn hạn trong ngày hôm nay -> Cho qua
                    showKey(today);
                } else {
                    // Nếu không có vé hoặc vé cũ (ngày hôm qua) -> BẮT VƯỢT LINK LẠI
                    localStorage.removeItem('access_proof');
                    document.getElementById('loading').innerText = "Truy cập trái phép! Đang chuyển hướng về Link4M...";
                    setTimeout(() => {
                        window.location.href = LINK4M_URL;
                    }, 2000);
                }
            }
        };

        function showKey(dateStr) {
            // Thuật toán tạo Key dựa trên ngày + salt
            const hash = simpleHash(dateStr + SECRET_SALT);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('key-box').style.display = 'block';
            document.getElementById('key').innerText = hash;
        }

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36).toUpperCase().substring(0, 8);
        }

        function copyKey() {
            const txt = document.getElementById('key').innerText;
            navigator.clipboard.writeText(txt);
            alert("Đã sao chép mã!");
        }
    </script>
</body>
</html>
