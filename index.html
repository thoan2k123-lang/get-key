<!DOCTYPE html>
<html>
<head>
    <title>Lấy Key - Trạm Tương Tác Số</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding-top: 50px; background: #e9ecef; color: #333; }
        .box { background: white; padding: 40px; border-radius: 15px; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 90%; }
        h2 { color: #007bff; margin-bottom: 10px; }
        #key { font-size: 32px; font-weight: bold; color: #28a745; margin: 25px 0; border: 3px dashed #28a745; padding: 20px; background: #f8fff9; border-radius: 10px; cursor: pointer; }
        .btn { background: #007bff; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0056b3; }
        .note { font-size: 13px; color: #6c757d; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Mã Kích Hoạt Tool (24h)</h2>
        <p>Hệ thống xác nhận bạn đã vượt link thành công!</p>
        
        <div id="key" onclick="copyKey()" title="Click để copy">Đang tạo mã...</div>
        
        <button class="btn" onclick="copyKey()">SAO CHÉP MÃ</button>
        <p class="note">Mã có tác dụng đến 23:59 hôm nay. <br> Sau thời gian này, vui lòng quay lại lấy mã mới.</p>
    </div>

    <script>
        // 1. CẤU HÌNH (Quan trọng: Salt phải giống hệt trong code Tool)
        const SECRET_SALT = "ThoanDepTrai@2026"; 
        const LINK4M_URL = "https://link4m.com/wY7PY3"; 

        // 2. KIỂM TRA TRUY CẬP
        const params = new URLSearchParams(window.location.search);
        if (params.get('status') !== 'success') {
            alert("Vui lòng vượt link rút gọn để lấy key!");
            window.location.href = LINK4M_URL;
        } else {
            // Chạy ngay khi trang web tải xong
            window.onload = function() {
                try {
                    const today = new Date();
                    const dateStr = today.getFullYear() + 
                                    String(today.getMonth() + 1).padStart(2, '0') + 
                                    String(today.getDate()).padStart(2, '0');
                    
                    // Hàm tạo mã đơn giản không cần thư viện ngoài
                    const rawStr = dateStr + SECRET_SALT;
                    const finalKey = simpleHash(rawStr);
                    
                    document.getElementById("key").innerText = finalKey;
                } catch (err) {
                    document.getElementById("key").innerText = "LỖI TẠO MÃ";
                    console.error(err);
                }
            };
        }

        // Hàm tạo mã băm đơn giản (Thay thế MD5 cho nhẹ và ổn định)
        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; 
            }
            return Math.abs(hash).toString(16).toUpperCase().substring(0, 8);
        }

        function copyKey() {
            const keyText = document.getElementById("key").innerText;
            if(keyText === "Đang tạo mã...") return;
            
            navigator.clipboard.writeText(keyText).then(() => {
                alert("Đã sao chép mã: " + keyText);
            });
        }
    </script>
</body>
</html>
